<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;width:335px;padding:14px;color:#26313a}h3{margin:0 0 8px}p{line-height:1.6;color:#65737d}label{display:block;margin:11px 0;font-weight:bold}input{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:8px;border:1px solid #bcc7ce;border-radius:4px}button{background:#157d3d;color:white;border:0;border-radius:4px;padding:9px 14px;font-weight:bold;cursor:pointer}#session,#status,#vpStartStatus{background:#f4f6f7;padding:10px;margin:9px 0;white-space:pre-wrap}a{color:#156c8e}</style><h3>XCPC VP · QOJ 同步</h3><div id="session">读取比赛…</div><label>榜单主机地址<input id="serverUrl" placeholder="http://127.0.0.1:8770"></label><label>QOJ 用户名（自动识别失败时填写）<input id="handle" placeholder="QOJ 用户名"></label><button id="save">保存并连接</button><p>先在 QOJ 登录，然后保持本地榜单页面打开即可同步；打开任意 QOJ 页面也可以。扩展只沿用浏览器登录会话读取比赛、倒计时和本账号提交，原始 Cookie 不会发给榜单。</p><div id="vpStartStatus">等待识别 VP 起点…</div><p id="status">尚未同步</p><a id="openSubmissions" target="_blank">在 QOJ 查看本场提交 ↗</a><script src="popup.js"></script></html>
